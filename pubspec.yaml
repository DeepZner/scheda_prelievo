name: scheda_prelievo
description: "App Magazzino Speleo Club Roma - Gestione prelievi e riconsegne attrezzature speleo."
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  go_router: ^14.1.4
  http: ^1.2.1
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
