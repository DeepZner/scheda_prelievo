name: Android Build & Distribution

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_split_apk:
        description: 'Compila anche APK separati per architettura (file più leggeri per test)'
        type: boolean
        default: false
      build_bundle:
        description: 'Compila Android App Bundle (.aab)'
        type: boolean
        default: false
      create_release:
        description: 'Crea una GitHub Release (anche senza tag v*)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test_and_analyze:
    name: Verifica Qualità & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verifica ambiente Flutter
        run: flutter doctor -v

      - name: Installa dipendenze
        run: flutter pub get

      - name: Analisi statica del codice (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Esecuzione test unitari (flutter test)
        run: flutter test

  build_android:
    name: Compilazione Android (APK & Distribuzione)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installa dipendenze
        run: flutter pub get

      - name: Estrai versione da pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //; s/+.*//')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/.*+//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "App Version: $VERSION+$BUILD_NUMBER"

      - name: Compila APK Universale (funziona su qualsiasi dispositivo Android)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p dist/
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MagazzinoSpeleo-v$VERSION.apk"

      - name: Compila APK per architettura (Split per ABI opzionale)
        if: github.event.inputs.build_split_apk == 'true'
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/MagazzinoSpeleo-v$VERSION-arm64-v8a.apk"
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/MagazzinoSpeleo-v$VERSION-armeabi-v7a.apk"
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/MagazzinoSpeleo-v$VERSION-x86_64.apk"
          fi

      - name: Compila Android App Bundle (.aab)
        if: github.event.inputs.build_bundle == 'true'
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation
          cp build/app/outputs/bundle/release/app-release.aab "dist/MagazzinoSpeleo-v$VERSION.aab"

      - name: Carica Artifacts su GitHub Actions (solo per build di test/PR senza Release)
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v5
        with:
          name: MagazzinoSpeleo-Android-Build
          path: dist/*
          retention-days: 1

      - name: Pubblica GitHub Release (su Tag o richiesta manuale)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Speleo Magazzino ${{ github.ref_name }}
          draft: false
          prerelease: false
